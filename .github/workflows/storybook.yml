name: storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Colour tokens must keep their text contrast (WCAG AA) before anything is published.
      - run: npm run check:contrast
      - run: npm run build-storybook
      # Every story must pass axe in light and dark. Findings the owner accepted are listed in scripts/check-a11y.mjs.
      # Runs on the build above; the runner's Google Chrome is used, nothing is downloaded.
      - run: npm run check:a11y -- --no-build
      # Publish from main only. Pull requests build Storybook as a check and never replace the live site.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
